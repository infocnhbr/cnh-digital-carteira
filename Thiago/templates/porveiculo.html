<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNH do Brasil - Veículos</title>
    <link rel="stylesheet" href="../static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #f2f2f2;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Topo Azul Escuro */
        .top-bar-veiculos {
            background-color: #002256;
            color: white;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-button {
            color: white;
            text-decoration: none;
            font-size: 18px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .back-button:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        .title-container {
            display: flex;
            flex-direction: column;
        }

        .page-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .page-subtitle {
            font-size: 11px;
            color: #d1d5db;
            margin-top: 2px;
        }

        /* Conteúdo Central */
        .empty-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .empty-title {
            font-size: 18px;
            font-weight: 500;
            color: #1b1b1b;
            margin-bottom: 12px;
        }

        .reload-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            color: #555;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .reload-button:hover {
            color: #002256;
        }

        .reload-button i {
            font-size: 14px;
            color: #0055d4;
        }
    </style>
</head>
<body>

    <!-- Barra Superior -->
    <header class="top-bar-veiculos">
        <a href="../templates/infracoes.html" class="back-button" title="Voltar">
            <i class="fa-solid fa-chevron-left"></i>
        </a>
        <div class="title-container">
            <h1 class="page-title">VEÍCULOS</h1>
            <span class="page-subtitle">Atualizado em 25/07/2026 - 16:06:25</span>
        </div>
    </header>

    <!-- Mensagem de Sem Veículos -->
    <main class="empty-container">
        <h2 class="empty-title">Você não possui veículos</h2>
        <button class="reload-button" onclick="location.reload()">
            <i class="fa-solid fa-rotate-right"></i>
            <span>Toque para atualizar</span>
        </button>
    </main>

</body>
</html>
