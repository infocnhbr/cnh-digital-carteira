<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNH do Brasil - Condutor</title>
    <link rel="stylesheet" href="../static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Barra Superior da Página Condutor -->
    <header class="top-bar-condutor">
        <a href="../templates/dashboard.html" class="back-button">
            <i class="fa-solid fa-chevron-left"></i>
        </a>
        <h1 class="page-title">CONDUTOR</h1>
    </header>

    <!-- Conteúdo Principal -->
    <main class="condutor-container">

        <!-- Card de Informações do Condutor -->
        <section class="info-card">
            <h2>Informações do Condutor</h2>
            <hr class="info-divider">

            <div class="info-group single-line">
                <span class="label">Nome</span>
                <span class="value">PE*** BER***** OLI*****</span>
            </div>

            <div class="info-grid">
                <div class="info-group">
                    <span class="label">CPF</span>
                    <span class="value">***.465.086 -**</span>
                </div>
                <div class="info-group">
                    <span class="label">Sexo</span>
                    <span class="value">MASCULINO</span>
                </div>

                <div class="info-group">
                    <span class="label">Categoria</span>
                    <span class="value">B</span>
                </div>
                <div class="info-group">
                    <span class="label">UF de Emissão</span>
                    <span class="value">MG</span>
                </div>

                <div class="info-group">
                    <span class="label">Data de Validade</span>
                    <span class="value">10/03/2027</span>
                </div>
                <div class="info-group">
                    <span class="label">Data de Emissão</span>
                    <span class="value">10/03/2026</span>
                </div>
            </div>
        </section>

        <!-- Grid de Botões de Ações -->
        <section class="actions-grid">
            <a href="../templates/habilitacao.html" class="action-card">
                <i class="fa-regular fa-id-card"></i>
                <span>HABILITAÇÃO</span>
            </a>

            <a href="#" class="action-card">
                <i class="fa-solid fa-user-check"></i>
                <span>CADASTRO POSITIVO</span>
            </a>

            <a href="#" class="action-card">
                <i class="fa-solid fa-vial"></i>
                <span>EXAMES TOXICOLÓGICOS</span>
            </a>

            <a href="#" class="action-card">
                <i class="fa-regular fa-id-badge"></i>
                <span>CURSOS ESPECIALIZADOS</span>
            </a>

            <a href="#" class="action-card full-width">
                <i class="fa-solid fa-bars-staggered"></i>
                <span>CREDENCIAL DE ESTACIONAMENTO</span>
            </a>
        </section>

    </main>

</body>
</html>
