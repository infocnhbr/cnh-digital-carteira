<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNH do Brasil - Infrações</title>
    <link rel="stylesheet" href="../static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #f2f2f2;
            min-height: 100vh;
        }

        /* Topo Azul Escuro */
        .top-bar-infracoes {
            background-color: #002256;
            color: white;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-button {
            color: white;
            text-decoration: none;
            font-size: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .back-button:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        .page-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Lista de Opções */
        .options-list {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
        }

        .option-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background-color: transparent;
            text-decoration: none;
            color: #333;
            transition: background-color 0.2s;
        }

        .option-item:active,
        .option-item:hover {
            background-color: #e5e5e5;
        }

        .option-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .option-icon {
            font-size: 18px;
            color: #0047b3;
            width: 20px;
            text-align: center;
        }

        .option-label {
            font-size: 15px;
            font-weight: 400;
            color: #333333;
        }

        .option-arrow {
            font-size: 14px;
            color: #0047b3;
        }
    </style>
</head>
<body>

    <!-- Barra Superior -->
    <header class="top-bar-infracoes">
        <a href="dashboard.html" class="back-button" title="Voltar">
            <i class="fa-solid fa-chevron-left"></i>
        </a>
        <h1 class="page-title">INFRAÇÕES</h1>
    </header>

    <!-- Lista de Menu -->
    <main class="options-list">

        <a href="../templates/porinfrator.html" class="option-item">
            <div class="option-left">
                <i class="fa-solid fa-user option-icon"></i>
                <span class="option-label">Por Infrator</span>
            </div>
            <i class="fa-solid fa-chevron-right option-arrow"></i>
        </a>

        <a href="../templates/porveiculo.html" class="option-item">
            <div class="option-left">
                <i class="fa-solid fa-car option-icon"></i>
                <span class="option-label">Por Veículo</span>
            </div>
            <i class="fa-solid fa-chevron-right option-arrow"></i>
        </a>

    </main>

</body>
</html>
